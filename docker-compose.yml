name: url-shortener-backend

services:
  db:
    container_name: url-shortener-backend-db
    image: postgres:16
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    container_name: url-shortener-backend-api
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=urlshortener;Username=postgres;Password=postgres
      DataProtection__KeyRingPath: /app/keys
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_api_keys:/app/keys

volumes:
  backend_postgres_data:
  backend_api_keys:
